name: OpenSpec

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenSpec artifacts
        run: npx --yes @fission-ai/openspec@1.11.0 validate --all --strict --no-interactive
